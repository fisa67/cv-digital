<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Filipe Santos — Executive Career Profile</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F172A;
  --slate:#1E293B;
  --blue:#2563EB;
  --blue-light:#3B82F6;
  --cyan:#06B6D4;
  --gray:#64748B;
  --light:#F8FAFC;
  --white:#FFFFFF;
  --border:#E2E8F0;
  --text:#0F172A;
  --text-muted:#64748B;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.08);
  --shadow-lg:0 8px 32px rgba(15,23,42,.16);
  --shadow-blue:0 4px 20px rgba(37,99,235,.25);
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;
  background:var(--light);
  color:var(--text);
  min-height:100vh;
  font-size:15px;
  line-height:1.6;
}

/* ── Scrollbar ─────────────────────────────────── */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--light)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Floating Toolbar ───────────────────────────── */
.toolbar{
  position:fixed;top:20px;right:20px;z-index:999;
  display:flex;flex-direction:column;gap:10px;
}
.toolbar-btn{
  display:flex;align-items:center;gap:8px;
  padding:11px 18px;border:none;border-radius:50px;
  font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;white-space:nowrap;
  box-shadow:var(--shadow-lg);
}
.toolbar-btn.primary{background:var(--blue);color:#fff}
.toolbar-btn.primary:hover{background:#1D4ED8;transform:translateY(-2px);box-shadow:var(--shadow-blue)}
.toolbar-btn.secondary{background:var(--white);color:var(--navy);border:1.5px solid var(--border)}
.toolbar-btn.secondary:hover{background:var(--light);transform:translateY(-2px)}
.toolbar-btn.cyan-btn{background:linear-gradient(135deg,var(--cyan),#0891B2);color:#fff}
.toolbar-btn.cyan-btn:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(6,182,212,.35)}

/* ── Hero ───────────────────────────────────────── */
.hero{
  background:linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#0F2044 100%);
  padding:80px 40px 60px;
  position:relative;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 70% 50%,rgba(37,99,235,.18) 0%,transparent 60%),
             radial-gradient(ellipse at 20% 80%,rgba(6,182,212,.12) 0%,transparent 50%);
  pointer-events:none;
}
.hero::after{
  content:'';position:absolute;
  bottom:-2px;left:0;right:0;height:60px;
  background:linear-gradient(to bottom,transparent,var(--light));
}
.hero-grid{
  max-width:1100px;margin:0 auto;
  display:grid;grid-template-columns:auto 1fr;
  gap:52px;align-items:center;position:relative;z-index:1;
}
.hero-photo-wrap{position:relative}
.hero-photo{
  width:200px;height:200px;border-radius:50%;
  object-fit:cover;object-position:center top;
  border:4px solid rgba(255,255,255,.15);
  box-shadow:0 0 0 8px rgba(37,99,235,.15),0 20px 60px rgba(0,0,0,.4);
  display:block;
}
.hero-photo-ring{
  position:absolute;inset:-14px;border-radius:50%;
  border:2px solid transparent;
  background:linear-gradient(135deg,rgba(37,99,235,.5),rgba(6,182,212,.5)) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;
  mask-composite:exclude;
  animation:spin 12s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-badge{
  position:absolute;bottom:10px;right:-8px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#fff;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:20px;
  box-shadow:0 4px 12px rgba(37,99,235,.4);
  white-space:nowrap;
}
.hero-text{color:#fff}
.hero-name{
  font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;
  background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.85) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero-main-title{
  font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25;
  color:#fff;margin-top:14px;
}
.hero-sub-title{
  font-size:13px;font-weight:500;letter-spacing:.6px;
  color:rgba(99,179,237,.9);margin-top:8px;
  background:linear-gradient(90deg,rgba(37,99,235,.18),rgba(6,182,212,.12));
  display:inline-block;padding:5px 14px;border-radius:20px;
  border:1px solid rgba(6,182,212,.25);
}
.hero-location{
  display:flex;align-items:center;gap:6px;
  color:rgba(255,255,255,.5);font-size:13px;margin-top:12px;
}
.hero-location svg{color:var(--cyan)}
.hero-summary{
  margin-top:22px;color:rgba(255,255,255,.72);
  font-size:15px;line-height:1.75;max-width:620px;
  padding:16px 20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  border-radius:var(--radius-sm);
  border-left:3px solid var(--cyan);
}
.hero-contacts{
  display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;
}
.contact-chip{
  display:flex;align-items:center;gap:7px;
  padding:8px 14px;border-radius:50px;
  font-size:13px;font-weight:500;
  text-decoration:none;transition:all .2s;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);
  color:rgba(255,255,255,.8);
}
.contact-chip:hover{background:rgba(255,255,255,.12);color:#fff;transform:translateY(-2px)}
.contact-chip.linkedin{
  background:linear-gradient(135deg,rgba(37,99,235,.35),rgba(29,78,216,.45));
  border-color:rgba(99,163,255,.5);color:#BAD9FF;
  padding:10px 20px;font-size:14px;font-weight:700;
  box-shadow:0 0 0 0 rgba(37,99,235,0);
  transition:all .25s;
}
.contact-chip.linkedin:hover{
  background:linear-gradient(135deg,rgba(37,99,235,.6),rgba(29,78,216,.7));
  border-color:#3B82F6;color:#fff;
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 4px 20px rgba(37,99,235,.45),0 0 0 3px rgba(37,99,235,.15);
}
.contact-chip.whatsapp{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.3);color:#86EFAC}
.contact-chip.whatsapp:hover{background:rgba(34,197,94,.25);color:#fff}

/* ── Dashboard Metrics ──────────────────────────── */
.metrics-section{
  max-width:1100px;margin:-20px auto 0;
  padding:0 40px 40px;
  position:relative;z-index:2;
}
.metrics-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
}
.metric-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:28px 24px;
  transition:transform .2s,box-shadow .2s;
  position:relative;overflow:hidden;
}
.metric-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.metric-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.metric-card.featured{
  background:linear-gradient(135deg,var(--navy),var(--slate));
  border-color:transparent;
}
.metric-card.featured::before{
  background:linear-gradient(90deg,var(--cyan),var(--blue));
}
.metric-value{
  font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.metric-card.featured .metric-value{
  background:linear-gradient(135deg,var(--cyan),#67E8F9);
  -webkit-background-clip:text;background-clip:text;
}
.metric-label{
  font-size:13px;color:var(--text-muted);font-weight:600;
  margin-top:8px;letter-spacing:.2px;
}
.metric-card.featured .metric-label{color:rgba(255,255,255,.6)}
.metric-sub{
  font-size:11px;color:var(--text-muted);margin-top:4px;
  line-height:1.4;
}
.metric-card.featured .metric-sub{color:rgba(255,255,255,.4)}
.metric-icon{
  position:absolute;top:20px;right:20px;
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(6,182,212,.1));
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.metric-card.featured .metric-icon{
  background:rgba(255,255,255,.08);
}

/* ── Sections ────────────────────────────────────── */
.section{max-width:1100px;margin:0 auto;padding:0 40px 56px}
.section-header{
  display:flex;align-items:center;gap:14px;margin-bottom:32px;
}
.section-line{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border),transparent);
}
.section-title{
  font-size:11px;font-weight:700;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--text-muted);
  display:flex;align-items:center;gap:8px;
}
.section-title-dot{
  width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  flex-shrink:0;
}
.section-subtitle{
  font-size:30px;font-weight:800;letter-spacing:-0.8px;
  color:var(--navy);margin-bottom:8px;
}
.section-desc{color:var(--text-muted);font-size:15px;margin-bottom:32px}

/* ── About ───────────────────────────────────────── */
.about-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:40px;display:grid;grid-template-columns:1fr auto;
  gap:40px;align-items:start;
}
.about-text{font-size:16px;line-height:1.85;color:#334155}
.about-text p+p{margin-top:16px}
.about-highlight{
  display:inline;background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(6,182,212,.1));
  padding:2px 6px;border-radius:4px;font-weight:600;color:var(--navy);
}
.about-sidebar{display:flex;flex-direction:column;gap:12px;min-width:200px}
.about-stat{
  padding:16px 18px;background:var(--light);
  border-radius:var(--radius-sm);border:1px solid var(--border);
  text-align:center;
}
.about-stat-val{font-size:24px;font-weight:800;color:var(--blue)}
.about-stat-label{font-size:11px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

/* ── Timeline ────────────────────────────────────── */
.timeline{position:relative;padding-left:28px}
.timeline::before{
  content:'';position:absolute;left:10px;top:0;bottom:0;
  width:2px;background:linear-gradient(to bottom,var(--blue),var(--cyan),transparent);
}
.timeline-item{
  position:relative;margin-bottom:14px;
}
.timeline-item::before{
  content:'';position:absolute;left:-23px;top:20px;
  width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  border:2px solid var(--white);
  box-shadow:0 0 0 2px rgba(37,99,235,.15);
}
.timeline-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:18px 24px;transition:transform .2s,box-shadow .2s;
}
.timeline-card:hover{transform:translateX(4px);box-shadow:var(--shadow-lg)}
.timeline-card.current{
  border-color:rgba(37,99,235,.3);
  background:linear-gradient(135deg,rgba(37,99,235,.03),rgba(6,182,212,.03));
}
.timeline-card.current::after{
  content:'ATUAL';position:absolute;top:14px;right:16px;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
  color:#fff;font-size:10px;font-weight:700;letter-spacing:1px;
  padding:3px 10px;border-radius:20px;
}
.tl-company{
  display:flex;align-items:center;gap:10px;margin-bottom:4px;
}
.tl-company-badge{
  width:32px;height:32px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;color:#fff;flex-shrink:0;
}
.tl-role{font-size:16px;font-weight:700;color:var(--navy)}
.tl-company-name{font-size:12px;font-weight:600;color:var(--blue)}
.tl-period{font-size:11.5px;color:var(--text-muted);margin-top:3px;
  display:flex;align-items:center;gap:5px}
.tl-dot{width:3px;height:3px;border-radius:50%;background:var(--border)}
.tl-desc{margin-top:10px;color:#475569;font-size:13.5px;line-height:1.7}
.tl-achievements{
  margin-top:10px;display:flex;flex-direction:column;gap:5px;
}
.tl-ach{
  display:flex;align-items:flex-start;gap:9px;
  font-size:13px;color:#334155;
}
.tl-ach::before{
  content:'▹';color:var(--cyan);font-size:13px;flex-shrink:0;margin-top:1px;
}

/* ── Current Role Spotlight ──────────────────────── */
.current-role-card{
  background:linear-gradient(135deg,#0B1628 0%,#0F2044 50%,#0B1628 100%);
  border-radius:var(--radius);
  border:1px solid rgba(37,99,235,.35);
  box-shadow:0 0 0 1px rgba(6,182,212,.1),var(--shadow-lg);
  padding:40px 44px;
  position:relative;overflow:hidden;
}
.current-role-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--cyan),var(--blue-light));
}
.current-role-card::after{
  content:'';position:absolute;
  top:-120px;right:-120px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(37,99,235,.12) 0%,transparent 70%);
  pointer-events:none;
}
.cr-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:28px}
.cr-logo-wrap{display:flex;align-items:center;gap:16px}
.cr-logo{
  width:56px;height:56px;border-radius:14px;
  background:linear-gradient(135deg,#FF6B00,#FF3B00);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
  box-shadow:0 8px 24px rgba(255,107,0,.35);
}
.cr-company{color:#fff;font-size:24px;font-weight:800;letter-spacing:-.5px}
.cr-company-sub{color:rgba(255,255,255,.45);font-size:13px;font-weight:500;margin-top:2px}
.cr-badge{
  background:linear-gradient(135deg,rgba(6,182,212,.2),rgba(37,99,235,.2));
  border:1px solid rgba(6,182,212,.35);
  color:#67E8F9;font-size:11px;font-weight:700;
  padding:5px 14px;border-radius:20px;letter-spacing:.8px;
  white-space:nowrap;align-self:flex-start;
  animation:pulse-badge 2s ease-in-out infinite;
}
@keyframes pulse-badge{
  0%,100%{box-shadow:0 0 0 0 rgba(6,182,212,.3)}
  50%{box-shadow:0 0 0 6px rgba(6,182,212,0)}
}
.cr-role{color:rgba(255,255,255,.7);font-size:14px;font-weight:600;letter-spacing:.3px;margin-top:4px}
.cr-body{display:grid;grid-template-columns:1fr auto;gap:36px;align-items:start}
.cr-desc{color:rgba(255,255,255,.68);font-size:15px;line-height:1.8;max-width:600px}
.cr-pillars{display:flex;flex-direction:column;gap:10px;min-width:200px}
.cr-pillar{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  border-radius:10px;padding:10px 14px;
  color:rgba(255,255,255,.8);font-size:13px;font-weight:600;
  transition:background .2s;
}
.cr-pillar:hover{background:rgba(37,99,235,.15)}
.cr-pillar-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--cyan));
}
@media(max-width:900px){
  .cr-body{grid-template-columns:1fr}
  .cr-pillars{flex-direction:row;flex-wrap:wrap}
  .cr-pillar{flex:1;min-width:140px}
}

/* ── Skills Tags ──────────────────────────────────── */
.skills-grid{display:flex;flex-wrap:wrap;gap:10px}
.skill-tag{
  padding:9px 18px;border-radius:50px;
  font-size:13px;font-weight:600;
  transition:all .2s;cursor:default;
  border:1.5px solid transparent;
}
.skill-tag:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.skill-tag.core{
  background:linear-gradient(135deg,rgba(37,99,235,.1),rgba(6,182,212,.08));
  border-color:rgba(37,99,235,.2);color:var(--blue);
}
.skill-tag.core:hover{background:linear-gradient(135deg,rgba(37,99,235,.18),rgba(6,182,212,.15));border-color:var(--blue)}
.skill-tag.tech{
  background:rgba(100,116,139,.08);border-color:rgba(100,116,139,.2);color:#334155;
}
.skill-tag.tech:hover{background:rgba(100,116,139,.14);border-color:var(--gray)}
.skill-tag.soft{
  background:rgba(6,182,212,.08);border-color:rgba(6,182,212,.2);color:#0E7490;
}
.skill-tag.soft:hover{background:rgba(6,182,212,.15);border-color:var(--cyan)}

/* ── Education ────────────────────────────────────── */
.edu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.edu-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:32px;position:relative;overflow:hidden;
  transition:transform .2s,box-shadow .2s;
}
.edu-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.edu-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
}
.edu-degree{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:8px}
.edu-institution{font-size:14px;font-weight:600;color:var(--blue)}
.edu-meta{font-size:13px;color:var(--text-muted);margin-top:6px}
.edu-icon{font-size:32px;margin-bottom:16px}

/* ── Certifications ───────────────────────────────── */
.cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.cert-card{
  background:var(--white);border-radius:var(--radius-sm);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:16px 18px;transition:all .2s;
  display:flex;align-items:center;gap:12px;
}
.cert-card:hover{transform:translateY(-2px);border-color:rgba(37,99,235,.3);box-shadow:var(--shadow-lg)}
.cert-icon{
  width:36px;height:36px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(6,182,212,.1));
  display:flex;align-items:center;justify-content:center;font-size:16px;
}
.cert-name{font-size:13px;font-weight:600;color:var(--navy);line-height:1.35}

/* ── Languages ────────────────────────────────────── */
.lang-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.lang-card{
  background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);box-shadow:var(--shadow);
  padding:28px;text-align:center;transition:all .2s;
}
.lang-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.lang-flag{font-size:36px;margin-bottom:12px}
.lang-name{font-size:18px;font-weight:700;color:var(--navy)}
.lang-level{
  font-size:12px;font-weight:600;color:var(--blue);
  text-transform:uppercase;letter-spacing:.8px;margin-top:6px;
}
.lang-bar{
  height:4px;background:var(--border);border-radius:2px;
  margin-top:14px;overflow:hidden;
}
.lang-bar-fill{
  height:100%;border-radius:2px;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  transition:width .8s ease;
}

/* ── Footer ───────────────────────────────────────── */
footer{
  background:linear-gradient(135deg,var(--navy),var(--slate));
  padding:60px 40px;text-align:center;
  position:relative;overflow:hidden;
}
footer::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 100%,rgba(37,99,235,.15) 0%,transparent 60%);
}
.footer-quote{
  font-size:20px;font-weight:700;color:#fff;
  max-width:700px;margin:0 auto;
  line-height:1.6;position:relative;z-index:1;
}
.footer-quote span{
  background:linear-gradient(135deg,var(--blue-light),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.footer-sub{
  color:rgba(255,255,255,.4);font-size:13px;margin-top:16px;
  position:relative;z-index:1;
}

/* ── Animations ───────────────────────────────────── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1;transform:translateY(0)}
}
.animate{animation:fadeUp .6s ease forwards;opacity:0}
.delay-1{animation-delay:.1s}
.delay-2{animation-delay:.2s}
.delay-3{animation-delay:.3s}
.delay-4{animation-delay:.4s}

/* ── Responsive ───────────────────────────────────── */
@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr;text-align:center}
  .hero-photo-wrap{margin:0 auto}
  .hero-summary{max-width:100%}
  .hero-contacts{justify-content:center}
  .metrics-grid{grid-template-columns:repeat(2,1fr)}
  .about-card{grid-template-columns:1fr}
  .about-sidebar{flex-direction:row;flex-wrap:wrap}
  .edu-grid,.lang-grid{grid-template-columns:1fr}
  .toolbar{flex-direction:row;top:auto;bottom:20px;right:50%;transform:translateX(50%)}
  .hero{padding:100px 24px 60px}
  .section{padding:0 24px 40px}
  .metrics-section{padding:0 24px 40px}
}
@media(max-width:600px){
  .hero-name{font-size:32px}
  .metrics-grid{grid-template-columns:1fr 1fr}
  .cert-grid{grid-template-columns:1fr}
}

/* ── Print Styles ─────────────────────────────────── */
@media print{
  .toolbar,.hero::after{display:none!important}
  body{background:#fff;font-size:11pt}
  .hero{
    background:#0F172A!important;-webkit-print-color-adjust:exact;
    print-color-adjust:exact;padding:30px;
  }
  .hero-photo-ring{display:none}
  .metric-card,.timeline-card,.edu-card,.cert-card,.lang-card,.about-card{
    break-inside:avoid;border:1px solid #E2E8F0!important;
    box-shadow:none!important;
  }
  .metrics-grid{grid-template-columns:repeat(4,1fr)}
  .section{padding:0 0 24px}
  .metrics-section{padding:0 0 24px}
  .timeline::before{background:#2563EB!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .skill-tag{border:1px solid #CBD5E1!important}
  footer{background:#0F172A!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  h2{color:#0F172A!important}
  @page{margin:15mm;size:A4}
}

<!-- profile-data -->
<!-- html2canvas loaded dynamically on demand -->
<script>
// ── Scroll Progress ────────────────────────────────
(function(){

// ── Conteúdo dinâmico: lê profile.json e monta o HTML ─────────────
// O visual não muda: o markup gerado aqui é o mesmo que antes era escrito à mão
// neste arquivo. Para editar o conteúdo use admin.html (ou edite profile.json).
var CV = (function(){
  var PREVIEW = /[?&]preview=1(&|$)/.test(location.search);
  var app = document.getElementById('app');
  var ICON = {
    li: "<svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z\"/></svg>",
    mail: "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z\"/><polyline points=\"22,6 12,13 2,6\"/></svg>",
    wa: "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z\"/></svg>",
    globe: "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><line x1=\"2\" y1=\"12\" x2=\"22\" y2=\"12\"/><path d=\"M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z\"/></svg>",
    phone: "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z\"/></svg>",
    pin: "<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z\"/><circle cx=\"12\" cy=\"10\" r=\"3\"/></svg>"
  };
  var FOOT_A = 'color:rgba(255,255,255,.5);font-size:13px;text-decoration:none;transition:color .2s';

  // ── Utilidades ───────────────────────────────────
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function digits(s){ return String(s == null ? '' : s).replace(/\D/g, ''); }
  function color(c, def){ return /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : def; }
  function safeUrl(u){
    u = String(u == null ? '' : u).trim();
    if(!u) return '';
    var m = u.match(/^([a-z][a-z0-9+.-]*):/i);
    if(m) return /^(https?|mailto|tel)$/i.test(m[1]) ? u : '';
    if(/^www\./i.test(u)) return 'https://' + u;
    return u; // relativo ou âncora
  }

  // ── Sanitizador de HTML (campos de texto rico) ───
  // Só permite formatação básica. Qualquer outra tag/atributo é descartado.
  var TAGS = {P:1,BR:1,STRONG:1,EM:1,U:1,S:1,UL:1,OL:1,LI:1,A:1,H2:1,H3:1,H4:1,SPAN:1,DIV:1};
  var MAP  = {B:'STRONG',I:'EM',STRIKE:'S',DEL:'S'};
  var BLOCK = {P:1,UL:1,OL:1,LI:1,H2:1,H3:1,H4:1,DIV:1};
  function cleanStyle(n){
    var out = [], st = n.style;
    var al = (st && st.textAlign) || n.getAttribute('align') || '';
    if(/^(left|center|right|justify)$/i.test(al)) out.push('text-align:' + al.toLowerCase());
    var col = st && st.color;
    if(col && /^(#[0-9a-f]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))$/i.test(col)) out.push('color:' + col);
    return out.join(';');
  }
  function walk(node, inline){
    var out = '';
    Array.prototype.forEach.call(node.childNodes, function(n){
      if(n.nodeType === 3){ out += esc(n.nodeValue); return; }
      if(n.nodeType !== 1) return;
      if(n.tagName === 'SCRIPT' || n.tagName === 'STYLE') return;
      var tag = MAP[n.tagName] || n.tagName;
      if(!TAGS[tag]){ out += walk(n, inline); return; }
      if(tag === 'BR'){ out += inline ? ' ' : '<br>'; return; }
      if(inline && BLOCK[tag]){ out += walk(n, inline) + ' '; return; }
      var attrs = '';
      if(tag === 'A'){
        var h = safeUrl(n.getAttribute('href'));
        if(h) attrs += ' href="' + esc(h) + '" target="_blank" rel="noopener noreferrer"';
      }
      var st = cleanStyle(n);
      if(st) attrs += ' style="' + st + '"';
      if(/(^|\s)about-highlight(\s|$)/.test(n.getAttribute('class') || '')) attrs += ' class="about-highlight"';
      var t = tag.toLowerCase();
      out += '<' + t + attrs + '>' + walk(n, inline) + '</' + t + '>';
    });
    return out;
  }
  function sanitize(html, inline){
    if(!html) return '';
    var doc = new DOMParser().parseFromString('<body>' + html, 'text/html');
    return walk(doc.body, !!inline).trim();
  }

  // ── Blocos de markup ─────────────────────────────
  // URL de contato digitada sem "https://" (ex.: github.com/fulano) vira link externo.
  function webUrl(u){
    u = safeUrl(u);
    return u && !/^([a-z][a-z0-9+.-]*:|[\/#.])/i.test(u) ? 'https://' + u : u;
  }
  function head(title, style){
    return '<div class="section-header"' + (style ? ' style="' + style + '"' : '') + '>\n' +
      '    <div class="section-title"><div class="section-title-dot"></div>' + esc(title) + '</div>\n' +
      '    <div class="section-line"></div>\n  </div>';
  }
  // Texto rico: usa <p> (como no original) quando não há blocos dentro; senão <div>.
  function richBlock(cls, html, indent){
    var tag = /<(p|div|ul|ol|h[2-4])[\s>]/i.test(html) ? 'div' : 'p';
    return '<' + tag + ' class="' + cls + '">\n' + indent + html + '\n' + indent.slice(2) + '</' + tag + '>';
  }
  function chip(href, cls, icon, label, blank){
    return '<a href="' + esc(href) + '"' + (blank ? ' target="_blank"' : '') + ' class="contact-chip' + (cls ? ' ' + cls : '') + '">\n' +
      '          ' + icon + '\n          ' + esc(label) + '\n        </a>';
  }
  function footLink(href, label, hover, blank){
    return '<a href="' + esc(href) + '"' + (blank ? ' target="_blank"' : '') + ' style="' + FOOT_A + '" ' +
      'onmouseover="this.style.color=\'' + hover + '\'" onmouseout="this.style.color=\'rgba(255,255,255,.5)\'">' + esc(label) + '</a>';
  }

  // Lista de contatos (chips do hero e links do rodapé), na mesma ordem do original.
  function contactList(c){
    c = c || {};
    var list = [];
    var li = webUrl(c.linkedin), em = String(c.email || '').trim(), wa = digits(c.whatsapp);
    var ph = String(c.phone || '').trim(), web = webUrl(c.website);
    if(li)  list.push({href: li, cls: 'linkedin', icon: ICON.li, label: 'Ver Perfil no LinkedIn', foot: 'LinkedIn', hover: '#93C5FD', blank: true});
    if(em)  list.push({href: 'mailto:' + em, cls: '', icon: ICON.mail, label: 'E-mail', foot: 'E-mail', hover: '#93C5FD', blank: false});
    if(wa)  list.push({href: 'https://wa.me/' + wa, cls: 'whatsapp', icon: ICON.wa, label: 'WhatsApp', foot: 'WhatsApp', hover: '#86EFAC', blank: true});
    if(ph && digits(ph)) list.push({href: 'tel:+' + digits(ph).replace(/^\+/, ''), cls: '', icon: ICON.phone, label: ph, foot: ph, hover: '#93C5FD', blank: false});
    if(web) list.push({href: web, cls: '', icon: ICON.globe, label: 'Website', foot: 'Website', hover: '#93C5FD', blank: true});
    (c.links || []).forEach(function(l){
      var u = webUrl(l && l.url);
      if(!u || !(l.label || l.footerLabel)) return;
      list.push({href: u, cls: '', icon: ICON.globe, label: l.label || l.footerLabel, foot: l.footerLabel || l.label, hover: '#93C5FD', blank: true});
    });
    return list;
  }

  // ── Seções ───────────────────────────────────────
  function hero(d, photoSrc){
    var h = d.hero || {}, contacts = contactList(d.contacts);
    var src = photoSrc || ((h.photo || 'uploads/profile.jpg') + (d.meta && d.meta.updatedAt ? '?v=' + encodeURIComponent(d.meta.updatedAt) : ''));
    return '<section class="hero" id="sec-hero">\n  <div class="hero-grid">\n' +
      '    <div class="hero-photo-wrap animate">\n      <div class="hero-photo-ring"></div>\n' +
      '      <img src="' + esc(src) + '" alt="' + esc(h.name) + '" class="hero-photo">\n' +
      (h.badge ? '      <div class="hero-badge">\n        ' + esc(h.badge) + '\n      </div>\n' : '') +
      '    </div>\n    <div class="hero-text animate delay-1">\n' +
      (h.eyebrow ? '      <div class="hero-title" style="margin-bottom:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.45);font-weight:600">' + esc(h.eyebrow) + '</div>\n' : '') +
      '      <h1 class="hero-name">' + esc(h.name) + '</h1>\n' +
      (h.title ? '      <div class="hero-main-title">' + esc(h.title) + '</div>\n' : '') +
      ((h.keywords || []).length ? '      <div class="hero-sub-title">' + h.keywords.map(esc).join('\u00a0\u00a0•\u00a0\u00a0') + '</div>\n' : '') +
      (h.location ? '      <div class="hero-location">\n        ' + ICON.pin + '\n        ' + esc(h.location) + '\n      </div>\n' : '') +
      (h.summary ? '      ' + richBlock('hero-summary', sanitize(h.summary), '        ') + '\n' : '') +
      '      <div class="hero-contacts">\n        ' +
      contacts.map(function(c){ return chip(c.href, c.cls, c.icon, c.label, c.blank); }).join('\n        ') +
      '\n      </div>\n    </div>\n  </div>\n</section>';
  }

  function metrics(d){
    var items = d.metrics || [];
    if(!items.length) return '';
    return '<div class="metrics-section" id="sec-metrics">\n  <div class="metrics-grid">\n' +
      items.map(function(m, i){
        return '    <div class="metric-card' + (m.featured ? ' featured' : '') + ' animate delay-' + Math.min(i + 1, 4) + '">\n' +
          '      <div class="metric-icon">' + esc(m.icon) + '</div>\n' +
          '      <div class="metric-value">' + esc(m.value) + '</div>\n' +
          '      <div class="metric-label">' + esc(m.label) + '</div>\n' +
          '      <div class="metric-sub">' + esc(m.sub) + '</div>\n    </div>';
      }).join('\n') + '\n  </div>\n</div>';
  }

  function about(d){
    var a = d.about; if(!a) return '';
    return '<section class="section" id="sec-about">\n  ' + head(a.title) + '\n' +
      '  <h2 class="section-subtitle">' + esc(a.subtitle) + '</h2>\n' +
      '  <div class="about-card animate">\n    <div class="about-text">\n      ' + sanitize(a.html) + '\n    </div>\n' +
      '    <div class="about-sidebar">\n' +
      (a.stats || []).map(function(s){
        return '      <div class="about-stat">\n        <div class="about-stat-val">' + esc(s.value) + '</div>\n' +
          '        <div class="about-stat-label">' + esc(s.label) + '</div>\n      </div>';
      }).join('\n') + '\n    </div>\n  </div>\n</section>';
  }

  function currentRole(d){
    var c = d.currentRole; if(!c || c.enabled === false) return '';
    return '<section class="section" style="padding-bottom:0" id="sec-current">\n  ' + head(c.sectionTitle) + '\n' +
      '  <h2 class="section-subtitle">' + esc(c.heading) + '</h2>\n' +
      (c.desc ? '  <p class="section-desc" style="margin-bottom:24px">' + esc(c.desc) + '</p>\n' : '') +
      '  <div class="current-role-card animate">\n    <div class="cr-header">\n      <div class="cr-logo-wrap">\n' +
      '        <div class="cr-logo">' + esc(c.icon) + '</div>\n        <div>\n' +
      '          <div class="cr-company">' + esc(c.company) + '</div>\n' +
      '          <div class="cr-role">' + esc(c.role) + '</div>\n' +
      '          <div class="cr-company-sub">' + esc(c.period) + '</div>\n        </div>\n      </div>\n' +
      (c.badge ? '      <div class="cr-badge">' + esc(c.badge) + '</div>\n' : '') +
      '    </div>\n    <div class="cr-body">\n' +
      '      ' + richBlock('cr-desc', sanitize(c.description), '        ') + '\n' +
      '      <div class="cr-pillars">\n' +
      (c.pillars || []).map(function(p){ return '        <div class="cr-pillar"><div class="cr-pillar-dot"></div>' + esc(p) + '</div>'; }).join('\n') +
      '\n      </div>\n    </div>\n  </div>\n</section>';
  }

  function experience(d){
    var e = d.experience; if(!e || !(e.items || []).length) return '';
    var items = e.items.map(function(it, i){
      var per = '<span>' + esc(it.start) + '</span>' +
        (it.end ? '<span class="tl-dot"></span><span>' + esc(it.end) + '</span>' : '') +
        (it.extra ? '<span class="tl-dot"></span><span>' + esc(it.extra) + '</span>' : '');
      var ach = (it.achievements || []).map(function(a){ return '          <div class="tl-ach">' + sanitize(a, true) + '</div>'; }).join('\n');
      var bg = 'linear-gradient(135deg,' + color(it.color1, '#2563EB') + ',' + color(it.color2, '#1D4ED8') + ')';
      return '    <div class="timeline-item animate' + (i >= 1 && i <= 4 ? ' delay-' + i : '') + '">\n' +
        '      <div class="timeline-card' + (it.current ? ' current" style="position:relative' : '') + '">\n' +
        '        <div class="tl-company">\n          <div class="tl-company-badge" style="background:' + bg + '">' + esc(it.icon) + '</div>\n' +
        '          <div>\n            <div class="tl-role">' + esc(it.role) + '</div>\n' +
        '            <div class="tl-company-name">' + esc(it.company) + '</div>\n          </div>\n        </div>\n' +
        '        <div class="tl-period">\n          ' + per + '\n        </div>\n' +
        (it.description ? '        <div class="tl-desc">\n          ' + sanitize(it.description) + '\n        </div>\n' : '') +
        (ach ? '        <div class="tl-achievements">\n' + ach + '\n        </div>\n' : '') +
        '      </div>\n    </div>';
    }).join('\n\n');
    return '<section class="section" id="sec-experience">\n  ' + head(e.title, 'margin-top:40px') + '\n' +
      '  <h2 class="section-subtitle">' + esc(e.subtitle) + '</h2>\n' +
      (e.desc ? '  <p class="section-desc">' + esc(e.desc) + '</p>\n' : '') +
      '\n  <div class="timeline">\n\n' + items + '\n\n  </div>\n</section>';
  }

  var SKILL_SWATCH = {
    core: 'linear-gradient(135deg,rgba(37,99,235,.2),rgba(6,182,212,.15))',
    tech: 'rgba(100,116,139,.15)',
    soft: 'rgba(6,182,212,.12)'
  };
  function skills(d){
    var s = d.skills; if(!s || !(s.items || []).length) return '';
    var cats = ['core', 'tech', 'soft'], labels = s.categories || {};
    var tags = '';
    cats.forEach(function(cat){
      s.items.forEach(function(it){
        if(it.category === cat) tags += '    <span class="skill-tag ' + cat + '">' + esc(it.name) + '</span>\n';
      });
    });
    var legend = cats.map(function(cat){
      return '    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)"><div style="width:12px;height:12px;border-radius:3px;background:' + SKILL_SWATCH[cat] + '"></div>' + esc(labels[cat]) + '</div>';
    }).join('\n');
    return '<section class="section" style="background:linear-gradient(135deg,rgba(37,99,235,.03),rgba(6,182,212,.03));padding-top:48px;padding-bottom:48px;border-radius:0" id="sec-skills">\n  ' + head(s.title) + '\n' +
      '  <h2 class="section-subtitle">' + esc(s.subtitle) + '</h2>\n' +
      '  <div class="skills-grid animate">\n' + tags + '  </div>\n' +
      '  <div style="display:flex;gap:24px;margin-top:24px;flex-wrap:wrap">\n' + legend + '\n  </div>\n</section>';
  }

  function education(d){
    var e = d.education; if(!e || !(e.items || []).length) return '';
    return '<section class="section" id="sec-education">\n  ' + head(e.title) + '\n' +
      '  <h2 class="section-subtitle">' + esc(e.subtitle) + '</h2>\n  <div class="edu-grid animate">\n' +
      e.items.map(function(it){
        return '    <div class="edu-card">\n      <div class="edu-icon">' + esc(it.icon) + '</div>\n' +
          '      <div class="edu-degree">' + esc(it.degree) + '</div>\n' +
          '      <div class="edu-institution">' + esc(it.institution) + '</div>\n' +
          '      <div class="edu-meta">' + esc(it.meta) + '</div>\n    </div>';
      }).join('\n') + '\n  </div>\n</section>';
  }

  function certifications(d){
    var c = d.certifications; if(!c || !(c.items || []).length) return '';
    return '<section class="section" id="sec-certifications">\n  ' + head(c.title) + '\n' +
      '  <h2 class="section-subtitle">' + esc(c.subtitle) + '</h2>\n  <div class="cert-grid animate">\n' +
      c.items.map(function(it){
        return '    <div class="cert-card"><div class="cert-icon">' + esc(it.icon) + '</div><div class="cert-name">' + esc(it.name) + '</div></div>';
      }).join('\n') + '\n  </div>\n</section>';
  }

  function languages(d){
    var l = d.languages; if(!l || !(l.items || []).length) return '';
    return '<section class="section" id="sec-languages">\n  ' + head(l.title) + '\n' +
      '  <h2 class="section-subtitle">' + esc(l.subtitle) + '</h2>\n  <div class="lang-grid animate">\n' +
      l.items.map(function(it){
        var pct = Math.max(0, Math.min(100, Number(it.percent) || 0));
        return '    <div class="lang-card">\n      <div class="lang-flag">' + esc(it.flag) + '</div>\n' +
          '      <div class="lang-name">' + esc(it.name) + '</div>\n' +
          '      <div class="lang-level">' + esc(it.level) + '</div>\n' +
          '      <div class="lang-bar"><div class="lang-bar-fill" style="width:' + pct + '%"></div></div>\n    </div>';
      }).join('\n') + '\n  </div>\n</section>';
  }

  function footer(d){
    var f = d.footer || {}, links = contactList(d.contacts);
    return '<footer id="sec-footer">\n' +
      '  <div class="footer-quote">\n    ' + sanitize(f.quote) + '\n  </div>\n' +
      (f.sub ? '  <p class="footer-sub">' + esc(f.sub) + '</p>\n' : '') +
      '  <div style="margin-top:24px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1">\n    ' +
      links.map(function(c){ return footLink(c.href, c.foot, c.hover, c.blank); })
           .join('\n    <span style="color:rgba(255,255,255,.15)">·</span>\n    ') +
      '\n  </div>\n</footer>';
  }

  // ── Montagem da página ───────────────────────────
  function applyChrome(d){
    var m = d.meta || {};
    if(m.title) document.title = m.title;
    if(m.lang) document.documentElement.lang = m.lang;
    if(m.description){
      var tag = document.querySelector('meta[name="description"]');
      if(!tag){ tag = document.createElement('meta'); tag.name = 'description'; document.head.appendChild(tag); }
      tag.content = m.description;
    }
    var btn = document.getElementById('tb-linkedin');
    if(btn){
      var url = webUrl(d.contacts && d.contacts.linkedin);
      btn.style.display = url ? '' : 'none';
      btn.onclick = function(){ window.open(url, '_blank'); };
    }
  }
  function renderAll(d, photoSrc){
    app.innerHTML = [
      hero(d, photoSrc), metrics(d), about(d), currentRole(d), experience(d),
      skills(d), education(d), certifications(d), languages(d), footer(d)
    ].filter(Boolean).join('\n\n');
    applyChrome(d);
  }
  function showError(err){
    app.innerHTML = '<div style="max-width:560px;margin:80px auto;padding:24px;font-family:sans-serif;color:#0F172A;line-height:1.6">' +
      '<h2 style="margin-bottom:8px">Não foi possível carregar o currículo</h2>' +
      '<p>' + esc(err && err.message ? err.message : err) + '</p>' +
      '<p style="margin-top:8px;color:#64748B;font-size:14px">Se você abriu o arquivo direto do disco (file://), rode um servidor local, por exemplo: <code>python3 -m http.server 8000</code>, e acesse <code>http://localhost:8000</code>.</p></div>';
  }

  // ── Animações de entrada (mesma lógica de antes) ──
  function initAnimations(){
    var els = document.querySelectorAll('.animate');
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(e){
          if(e.isIntersecting){ e.target.style.animationPlayState='running'; }
        });
      },{threshold:0.1});
      els.forEach(function(el){
        el.style.animationPlayState='paused';
        io.observe(el);
      });
    }else{
      els.forEach(function(el){ el.style.opacity='1'; });
    }
  }

  // ── Inicialização ────────────────────────────────
  function boot(){
    if(PREVIEW){
      // Modo pré-visualização (usado pelo admin.html dentro de um iframe):
      // recebe o perfil por postMessage e não anima (evita "piscar" a cada edição).
      var st = document.createElement('style');
      st.textContent = '.animate{animation:none!important;opacity:1!important}.hero-photo-ring,.cr-badge{animation:none!important}';
      document.head.appendChild(st);
      var origin = location.origin === 'null' ? '*' : location.origin;
      window.addEventListener('message', function(e){
        if(e.source !== window.parent || (e.origin !== location.origin)) return;
        var m = e.data || {};
        if(m.type === 'cv-hello'){
          window.parent.postMessage({type: 'cv-ready'}, origin);
        }else if(m.type === 'cv-profile'){
          try{ renderAll(m.data, m.photoSrc || null); }catch(err){ showError(err); }
          var ack = {type: 'cv-rendered', id: m.id};
          if(m.snapshot) ack.html = app.innerHTML;
          window.parent.postMessage(ack, origin);
        }else if(m.type === 'cv-scroll'){
          var el = document.getElementById(m.target);
          if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'});
        }
      });
      window.parent.postMessage({type: 'cv-ready'}, origin);
      return;
    }
    var inline = document.getElementById('profile-data');
    if(inline){
      // Versão exportada: dados embutidos no HTML (não depende de fetch).
      try{
        var data = JSON.parse(inline.textContent);
        if(app.hasAttribute('data-prerendered')) applyChrome(data); else renderAll(data);
        initAnimations();
      }catch(err){ showError(err); }
      return;
    }
    fetch('profile.json', {cache: 'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('profile.json não encontrado (HTTP ' + r.status + ').'); return r.json(); })
      .then(function(d){ renderAll(d); initAnimations(); })
      .catch(showError);
  }

  boot();
  return {renderAll: renderAll, sanitize: sanitize};
})();

// ── Export PNG via html2canvas CDN ────────────────
function exportPNG(){
  var btn = document.querySelector('.toolbar-btn.cyan-btn');
  btn.textContent = '⏳ Gerando...';
  btn.disabled = true;

  // Load html2canvas from CDN if not present
  function doCapture(){
    html2canvas(document.body,{
      scale: 2,
      useCORS: true,
      allowTaint: true,
      scrollY: 0,
      windowHeight: document.body.scrollHeight,
      height: document.body.scrollHeight,
      logging: false
    }).then(function(canvas){
      var link = document.createElement('a');
      link.download = 'filipe-santos-executive-profile.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.innerHTML = '📸 Exportar PNG';
      btn.disabled = false;
    }).catch(function(){
      btn.innerHTML = '📸 Exportar PNG';
      btn.disabled = false;
      alert('Erro ao gerar PNG. Tente usar Ctrl+P para imprimir como PDF.');
    });
  }

  if(typeof html2canvas === 'undefined'){
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload = doCapture;
    s.onerror = function(){
      btn.innerHTML = '📸 Exportar PNG';
      btn.disabled = false;
      alert('html2canvas não disponível offline. Use Ctrl+P para salvar como PDF.');
    };
    document.head.appendChild(s);
  } else {
    doCapture();
  }
}
</script>
