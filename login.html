<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Fisa CV Admin — Entrar</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 20% 15%,rgba(6,182,212,.12),transparent 42%),linear-gradient(135deg,#F1F5F9,#E2E8F0);font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#0F172A}.card{width:min(430px,100%);padding:38px 34px;text-align:center;background:#fff;border:1px solid #E2E8F0;border-radius:20px;box-shadow:0 18px 55px rgba(15,23,42,.13)}.mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 18px;color:#fff;background:linear-gradient(135deg,#2563EB,#06B6D4);border-radius:16px;box-shadow:0 8px 20px rgba(37,99,235,.25)}h1{font-size:24px;letter-spacing:-.6px;margin:0}p{color:#64748B;margin:9px 0 24px}.alert{display:none;padding:10px 12px;border-radius:9px;margin:0 0 18px;font-size:13px}.alert.show{display:block}.alert.error{background:#FEE2E2;color:#991B1B}.alert.info{background:#EFF6FF;color:#1D4ED8}.login{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border:0;border-radius:10px;background:#0F172A;color:white;font:600 14px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-decoration:none;transition:.18s}.login:hover{background:#1E293B;transform:translateY(-1px)}.login svg{width:19px;height:19px;fill:currentColor}.note{font-size:12px;margin:18px 0 0;color:#94A3B8}
</style>
</head>
<body>
<main class="card">
  <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="white" stroke-width="1.8"><circle cx="12" cy="12" r="8.7"/><path d="M8 15.4c.8.5 1.8.8 3 .8 2.8 0 4.6-1.5 4.6-3.8 0-2-1.5-3.3-3.6-3.3-1.5 0-2.7.6-3.5 1.6"/><path d="M8.2 7.1v4.3h4.2"/></svg></div>
  <h1>Fisa CV Admin</h1>
  <p>Acesse o painel para editar e publicar seu currículo digital.</p>
  <div class="alert error" id="error" role="alert"></div>
  <div class="alert info" id="info" role="status"></div>
  <a class="login" href="/api/auth/login"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.67-3.76-1.32-3.76-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.6 1.21 3.23.93.1-.72.39-1.21.71-1.49-2.47-.28-5.07-1.24-5.07-5.51 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.95 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.53.23 2.67.11 2.95.71.78 1.15 1.77 1.15 2.99 0 4.28-2.6 5.23-5.08 5.5.4.35.76 1.02.76 2.06v3.13c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/></svg>Entrar com GitHub</a>
  <p class="note">Acesso restrito à conta autorizada.</p>
</main>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const error = document.querySelector('#error'), info = document.querySelector('#info');
if (params.get('error') === 'denied') { error.textContent = 'Acesso não autorizado. Este painel está disponível somente para a conta GitHub fisa67.'; error.classList.add('show'); }
else if (params.get('error') === 'oauth') { error.textContent = 'Não foi possível concluir o login com GitHub. Tente novamente.'; error.classList.add('show'); }
else if (params.get('reason') === 'session') { info.textContent = 'Sua sessão terminou. Entre novamente para continuar.'; info.classList.add('show'); }
fetch('/api/auth/session', { credentials: 'same-origin', cache: 'no-store' }).then(r => { if (r.ok) location.replace('/admin.html'); }).catch(() => {});
</script>
</body>
</html>
