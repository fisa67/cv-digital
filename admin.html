<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel do Currículo — Admin</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#0F172A;--slate:#1E293B;--blue:#2563EB;--blue-d:#1D4ED8;--cyan:#06B6D4;
  --bg:#F1F5F9;--card:#fff;--line:#E2E8F0;--muted:#64748B;--text:#0F172A;--danger:#DC2626;--ok:#16A34A;
  --r:12px;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.06);
}
html,body{height:100%;margin:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Inter',sans-serif;color:var(--text);background:var(--bg);display:grid;grid-template-columns:248px minmax(0,1fr);overflow:hidden}
button{font:inherit;cursor:pointer}
code{background:#E2E8F0;border-radius:4px;padding:1px 5px;font-size:12px}

/* ── Menu lateral ── */
.side{background:var(--navy);color:#CBD5E1;display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 22px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:16px;letter-spacing:-.2px}
.brand small{color:#64748B;font-size:12px}
.nav{padding:14px 12px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nav h4{margin:16px 10px 6px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:#64748B;font-weight:700}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:0;background:none;color:#CBD5E1;border-radius:9px;text-align:left;font-size:14px;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:linear-gradient(135deg,rgba(37,99,235,.55),rgba(6,182,212,.3));color:#fff;font-weight:600}
.nav .ic{width:20px;text-align:center}
.side-foot{padding:14px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:6px}
.side-foot button{background:rgba(255,255,255,.05);color:#CBD5E1;border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;text-align:left}
.side-foot button:hover{background:rgba(255,255,255,.1);color:#fff}

/* ── Área principal ── */
main{display:grid;grid-template-rows:60px minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}
.top h2{margin:0;font-size:17px;letter-spacing:-.3px}
.status{font-size:12px;padding:3px 10px;border-radius:20px;background:#DCFCE7;color:#166534;font-weight:600}
.status.dirty{background:#FEF3C7;color:#92400E}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text);font-weight:600;font-size:13px;text-decoration:none}
.btn:hover{background:#F8FAFC}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.accent{background:linear-gradient(135deg,var(--cyan),#0891B2);border-color:transparent;color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.work{display:grid;grid-template-columns:minmax(360px,1fr) minmax(320px,46%);min-height:0}
.work.nopv{grid-template-columns:minmax(0,1fr)}
.work.nopv .pv{display:none}
#panel{overflow:auto;padding:26px 30px 90px;min-width:0}
.pv{background:#CBD5E1;border-left:1px solid var(--line);position:relative;overflow:hidden;min-width:0}
.pv iframe{position:absolute;top:0;left:0;width:1280px;border:0;background:#fff;transform-origin:0 0}
.pv-label{position:absolute;right:10px;bottom:8px;background:rgba(15,23,42,.75);color:#fff;font-size:11px;padding:3px 9px;border-radius:20px;z-index:2;pointer-events:none}

/* ── Formulários ── */
.page-h{margin-bottom:20px}
.page-h h1{margin:0;font-size:24px;letter-spacing:-.6px}
.page-h p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
.card>h3{margin:0 0 14px;font-size:14px;display:flex;align-items:center;gap:8px}
.card>h3 small{font-weight:500;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12px;font-weight:600;color:#475569}
.fld small{color:var(--muted);font-size:11.5px}
input[type=text],input[type=url],input[type=email],input[type=tel],input[type=number],input:not([type]),textarea,select{width:100%;font:inherit;padding:8px 11px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus,.rte-area:focus{outline:2px solid rgba(37,99,235,.35);border-color:var(--blue)}
textarea{resize:vertical;min-height:70px}
input[type=color]{width:100%;height:36px;padding:2px;border:1px solid #CBD5E1;border-radius:8px;background:#fff}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding-top:4px}
.chk input{width:16px;height:16px}
.photo-box{display:flex;gap:20px;align-items:center}
.photo-box img{width:120px;height:120px;border-radius:50%;object-fit:cover;object-position:center top;border:3px solid var(--line);background:#E2E8F0;flex-shrink:0}
.photo-box p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}

/* ── Rich text ── */
.rte-bar{display:flex;flex-wrap:wrap;gap:3px;padding:6px;background:#F8FAFC;border:1px solid #CBD5E1;border-bottom:0;border-radius:8px 8px 0 0}
.rte-bar button{min-width:30px;height:30px;padding:0 7px;border:1px solid transparent;border-radius:6px;background:none;color:#334155;font-size:13px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.rte-bar button:hover{background:#E2E8F0}
.rte-bar button.hl{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(6,182,212,.12));color:var(--blue)}
.rte-bar .sep{width:1px;background:#CBD5E1;margin:3px 4px}
.rte-area{min-height:96px;padding:10px 12px;border:1px solid #CBD5E1;border-radius:0 0 8px 8px;background:#fff;line-height:1.65;overflow-wrap:anywhere}
.rte-area p{margin:0 0 .7em}.rte-area p:last-child{margin-bottom:0}
.rte-area ul,.rte-area ol{margin:.3em 0 .3em 1.4em;padding:0}
.rte-area h2{font-size:20px;margin:.3em 0}.rte-area h3{font-size:17px;margin:.3em 0}
.rte-area a{color:var(--blue)}
.rte-area .about-highlight{background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(6,182,212,.12));padding:1px 5px;border-radius:4px;font-weight:600}
.rte-area strong[style]{background:#1E293B;border-radius:4px;padding:0 4px}
.rte.items .rte-area{min-height:130px}

/* ── Listas / itens ── */
.rows{display:flex;flex-direction:column;gap:8px}
.row-h,.row{display:flex;gap:8px;align-items:center}
.row-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:0 4px}
.row{padding:6px;border:1px solid var(--line);border-radius:10px;background:#fff}
.row.dragging,.item.dragging{opacity:.45}
.row.over,.item.over{outline:2px dashed var(--blue)}
.row>*,.row-h>*{min-width:0}
.handle{cursor:grab;color:#94A3B8;user-select:none;padding:0 4px;font-size:16px;flex:0 0 auto}
.handle:active{cursor:grabbing}
.btns{display:flex;gap:4px;flex:0 0 auto}
.btns button,.ib{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;color:#475569;font-size:14px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0}
.btns button:hover,.ib:hover{background:#F1F5F9}
.btns button.del:hover{background:#FEE2E2;color:var(--danger);border-color:#FCA5A5}
.item{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.item.open{box-shadow:var(--shadow);border-color:#BFDBFE}
.item-h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.item-t{flex:1;min-width:0;cursor:pointer;display:flex;flex-direction:column}
.item-t b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-t small{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 8px;border-radius:20px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}
.chev{transition:transform .15s}.item.open .chev{transform:rotate(90deg)}
.item-b{padding:4px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:14px;padding-top:16px}
.cat-h{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:700}
.skill-add{display:flex;gap:8px;margin-bottom:6px}
.skill-add input{flex:1}.skill-add select{width:210px}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed #CBD5E1;border-radius:10px}

/* ── Banner / toast / dialog ── */
.banner{display:flex;gap:10px;align-items:center;background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;padding:9px 14px;border-radius:10px;margin-bottom:18px;font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:30px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50;font-size:13px;display:flex;gap:12px;align-items:center;max-width:90vw}
.toast button{background:none;border:0;color:#67E8F9;font-weight:700;padding:0}
.toast.err{background:#991B1B}
dialog{border:0;border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(440px,92vw)}
dialog::backdrop{background:rgba(15,23,42,.55)}
dialog h3{margin:0 0 12px}
dialog .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.fatal{max-width:620px;margin:80px auto;padding:30px;background:#fff;border-radius:14px;box-shadow:var(--shadow)}
.fatal pre{background:var(--navy);color:#E2E8F0;padding:12px 16px;border-radius:8px;overflow:auto}

@media(max-width:1180px){.work{grid-template-columns:minmax(0,1fr)}.pv{display:none}.work.showpv{grid-template-columns:minmax(0,1fr)}.work.showpv #panel{display:none}.work.showpv .pv{display:block}}
@media(max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}.side{max-height:none}.nav{flex-direction:row;flex-wrap:wrap}.nav h4,.side-foot,.brand small{display:none}.nav button{width:auto}}
</style>
</head>
<body>

<aside class="side">
  <div class="brand"><b>Painel do Currículo</b><small>Editor local · Fase 1</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot">
    <button id="btnDownload">⬇ Baixar profile.json</button>
    <button id="btnImport">⬆ Importar profile.json</button>
    <button id="btnDiscard">↺ Descartar alterações</button>
    <input type="file" id="fileImport" accept="application/json,.json" hidden>
  </div>
</aside>

<main>
  <header class="top">
    <h2 id="title">Hero</h2>
    <span class="status" id="status">Salvo</span>
    <span class="grow"></span>
    <button class="btn sm" id="btnUndo" disabled title="Desfaz a última ação de lista (adicionar, remover, mover)">↶ Desfazer</button>
    <button class="btn sm" id="btnPv" title="Mostrar/ocultar pré-visualização">👁 Pré-visualização</button>
    <a class="btn sm" href="index.html" target="_blank" rel="noopener">↗ Abrir site</a>
    <button class="btn accent" id="btnExport">📦 Exportar HTML</button>
    <button class="btn primary" id="btnSave" title="Ctrl/Cmd + S">💾 Salvar no projeto</button>
  </header>
  <div class="work" id="work">
    <section id="panel"></section>
    <aside class="pv" id="pv">
      <iframe id="preview" src="index.html?preview=1" title="Pré-visualização do currículo"></iframe>
      <span class="pv-label">Pré-visualização ao vivo</span>
    </aside>
  </div>
</main>

<dialog id="linkDlg">
  <form method="dialog" id="linkForm">
    <h3>Inserir link</h3>
    <label class="fld"><span>Endereço (URL)</span><input id="linkUrl" type="text" placeholder="https://exemplo.com"></label>
    <div class="acts">
      <button type="button" class="btn danger" onclick="finishLink('remove')">Remover link</button>
      <span class="grow"></span>
      <button type="button" class="btn" onclick="finishLink('cancel')">Cancelar</button>
      <button type="submit" class="btn primary">Aplicar</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════
   Painel do currículo — Fase 1 (100% local, sem backend)
   • Lê/edita profile.json  • pré-visualização = o próprio index.html
   • Salvar: grava profile.json e uploads/profile.jpg na pasta do projeto
     (Chrome/Edge). Em outros navegadores, baixa os arquivos.
   ═══════════════════════════════════════════════════════════════ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split('.'), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };

const DRAFT_KEY = 'cv-admin-draft-v1';
const PHOTO_PATH = 'uploads/profile.jpg';
const state = {
  profile: null, server: null, photo: null,  // photo = {blob, dataUrl}
  section: 'hero', expanded: new Set(), dirty: false, dir: null, undo: []
};

/* ── Navegação ─────────────────────────────────── */
const NAV = [
  ['hero', 'Hero', '👤', 'sec-hero'], ['contacts', 'Contatos', '✉️', 'sec-hero'],
  ['experience', 'Experiências', '💼', 'sec-current'], ['skills', 'Competências', '🧩', 'sec-skills'],
  ['education', 'Formação', '🎓', 'sec-education'], ['certs', 'Certificações', '🏆', 'sec-certifications'],
  ['languages', 'Idiomas', '🌐', 'sec-languages'],
  ['—', 'Outras áreas do site'],
  ['metrics', 'Métricas', '📊', 'sec-metrics'], ['about', 'Sobre Mim', '📝', 'sec-about'],
  ['footer', 'Rodapé e Geral', '⚙️', 'sec-footer']
];
function renderNav() {
  $('#nav').innerHTML = NAV.map(n => n[0] === '—'
    ? `<h4>${n[1]}</h4>`
    : `<button data-nav="${n[0]}" class="${state.section === n[0] ? 'on' : ''}"><span class="ic">${n[2]}</span>${n[1]}</button>`).join('');
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-nav]'); if (!b) return;
  state.section = b.dataset.nav; renderNav(); renderPanel(true);
  const n = NAV.find(x => x[0] === state.section); postPreview({type: 'cv-scroll', target: n[3]});
});

/* ── Sanitizador (mesmas regras do index.html) ─── */
const TAGS = {P:1,BR:1,STRONG:1,EM:1,U:1,S:1,UL:1,OL:1,LI:1,A:1,H2:1,H3:1,H4:1,SPAN:1,DIV:1};
const TMAP = {B:'STRONG',I:'EM',STRIKE:'S',DEL:'S'};
const BLOCK = {P:1,UL:1,OL:1,LI:1,H2:1,H3:1,H4:1,DIV:1};
function safeUrl(u) {
  u = String(u ?? '').trim(); if (!u) return '';
  const m = u.match(/^([a-z][a-z0-9+.-]*):/i);
  if (m) return /^(https?|mailto|tel)$/i.test(m[1]) ? u : '';
  return /^www\./i.test(u) ? 'https://' + u : u;
}
function cleanStyle(n) {
  const out = [], st = n.style, al = (st && st.textAlign) || n.getAttribute('align') || '';
  if (/^(left|center|right|justify)$/i.test(al)) out.push('text-align:' + al.toLowerCase());
  const col = st && st.color;
  if (col && /^(#[0-9a-f]{3,8}|rgb\(\s*\d+\s*,\s*\d+\s*,\s*\d+\s*\))$/i.test(col)) out.push('color:' + col);
  return out.join(';');
}
function walk(node, inline) {
  let out = '';
  node.childNodes.forEach(n => {
    if (n.nodeType === 3) { out += esc(n.nodeValue); return; }
    if (n.nodeType !== 1 || n.tagName === 'SCRIPT' || n.tagName === 'STYLE') return;
    const tag = TMAP[n.tagName] || n.tagName;
    if (!TAGS[tag]) { out += walk(n, inline); return; }
    if (tag === 'BR') { out += inline ? ' ' : '<br>'; return; }
    if (inline && BLOCK[tag]) { out += walk(n, inline) + ' '; return; }
    let attrs = '';
    if (tag === 'A') { const h = safeUrl(n.getAttribute('href')); if (h) attrs += ` href="${esc(h)}" target="_blank" rel="noopener noreferrer"`; }
    const st = cleanStyle(n); if (st) attrs += ` style="${st}"`;
    if (/(^|\s)about-highlight(\s|$)/.test(n.getAttribute('class') || '')) attrs += ' class="about-highlight"';
    const t = tag.toLowerCase();
    out += `<${t}${attrs}>${walk(n, inline)}</${t}>`;
  });
  return out;
}
function sanitize(html, inline) {
  if (!html) return '';
  const doc = new DOMParser().parseFromString('<body>' + html, 'text/html');
  const out = walk(doc.body, !!inline).trim();
  return doc.body.textContent.trim() === '' ? '' : out;
}
function normUrl(u) {
  u = String(u || '').trim(); if (!u) return '';
  if (/^[a-z][a-z0-9+.-]*:/i.test(u) || /^[/#]/.test(u)) return u;
  if (/^[^\s/@]+@[^\s/@]+\.[^\s/@]+$/.test(u)) return 'mailto:' + u;
  return 'https://' + u;
}

/* ── Modelos de novos itens ───────────────────── */
const TPL = {
  experience: () => ({id: uid(), icon: '💼', color1: '#2563EB', color2: '#1D4ED8', role: 'Novo cargo', company: 'Empresa', start: '', end: '', extra: '', current: false, description: '', achievements: []}),
  cert: () => ({icon: '🏆', name: ''}),
  edu: () => ({icon: '🎓', degree: '', institution: '', meta: ''}),
  lang: () => ({flag: '🏳️', name: '', level: '', percent: 50}),
  metric: () => ({icon: '📈', value: '', label: '', sub: '', featured: false}),
  stat: () => ({value: '', label: ''}),
  link: () => ({label: '', footerLabel: '', url: 'https://'})
};
function normalize(p) {
  const d = (o, k, v) => { if (o[k] == null) o[k] = v; return o[k]; };
  ['meta', 'hero', 'contacts', 'about', 'currentRole', 'experience', 'skills', 'education', 'certifications', 'languages', 'footer'].forEach(k => d(p, k, {}));
  d(p, 'metrics', []); d(p.hero, 'keywords', []); d(p.contacts, 'links', []); d(p.about, 'stats', []);
  d(p.currentRole, 'pillars', []); d(p.experience, 'items', []); d(p.skills, 'items', []);
  d(p.skills, 'categories', {core: 'Core Strategy', tech: 'Ferramentas Técnicas', soft: 'Qualidade & Operações'});
  d(p.education, 'items', []); d(p.certifications, 'items', []); d(p.languages, 'items', []);
  p.hero.photo = PHOTO_PATH;
  p.experience.items.forEach(x => { d(x, 'id', uid()); d(x, 'achievements', []); });
  return p;
}

/* ── Estado: alterações, rascunho, desfazer ───── */
let draftT, pvT;
function changed() {
  state.dirty = true; updateStatus();
  clearTimeout(draftT); draftT = setTimeout(saveDraft, 400);
  clearTimeout(pvT); pvT = setTimeout(pushPreview, 120);
}
function updateStatus() {
  const s = $('#status'); s.textContent = state.dirty ? 'Alterações não salvas' : 'Salvo'; s.classList.toggle('dirty', state.dirty);
  $('#btnUndo').disabled = !state.undo.length;
}
function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify({profile: state.profile, photoDataUrl: state.photo ? state.photo.dataUrl : null})); }
  catch (e) { toast('Rascunho local não pôde ser guardado (armazenamento cheio).', true); }
}
function pushUndo() { state.undo.push(JSON.stringify(state.profile)); if (state.undo.length > 30) state.undo.shift(); updateStatus(); }
function undo() {
  const s = state.undo.pop(); if (!s) return;
  state.profile = JSON.parse(s); changed(); renderPanel();
}
$('#btnUndo').onclick = undo;

/* ── Toast ─────────────────────────────────────── */
let toastT;
function toast(msg, err, action) {
  $$('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : '');
  t.innerHTML = `<span>${esc(msg)}</span>`;
  if (action) { const b = document.createElement('button'); b.textContent = action.label; b.onclick = () => { action.fn(); t.remove(); }; t.appendChild(b); }
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), action ? 6000 : 3500);
}

/* ── Pré-visualização (iframe = index.html?preview=1) ── */
const frame = $('#preview');
let pvReady = false; const pending = new Map();
const pvOrigin = () => location.origin === 'null' ? '*' : location.origin;
function postPreview(msg) { if (pvReady && frame.contentWindow) frame.contentWindow.postMessage(msg, pvOrigin()); }
const hello = () => { if (frame.contentWindow) frame.contentWindow.postMessage({type: 'cv-hello'}, pvOrigin()); };
frame.addEventListener('load', hello);
function pushPreview() { if (state.profile) postPreview({type: 'cv-profile', data: state.profile, photoSrc: state.photo ? state.photo.dataUrl : null}); }
window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow || e.origin !== location.origin) return;
  const m = e.data || {};
  if (m.type === 'cv-ready') { pvReady = true; pushPreview(); }
  else if (m.type === 'cv-rendered' && pending.has(m.id)) { pending.get(m.id)(m.html); pending.delete(m.id); }
});
function snapshotHtml(profile) {
  return new Promise((res, rej) => {
    if (!pvReady) return rej(new Error('A pré-visualização não carregou. Abra o painel por um servidor local (http://localhost).'));
    const id = uid(); pending.set(id, res);
    postPreview({type: 'cv-profile', data: profile, photoSrc: null, snapshot: true, id});
    setTimeout(() => { if (pending.delete(id)) rej(new Error('A pré-visualização não respondeu.')); }, 6000);
  });
}
function fitPreview() {
  const pv = $('#pv'); if (!pv.clientWidth) return;
  const k = pv.clientWidth / 1280;
  frame.style.transform = `scale(${k})`; frame.style.height = (pv.clientHeight / k) + 'px';
}
new ResizeObserver(fitPreview).observe($('#pv'));
$('#btnPv').onclick = () => {
  const w = $('#work');
  if (matchMedia('(max-width:1180px)').matches) w.classList.toggle('showpv'); else w.classList.toggle('nopv');
  fitPreview();
};

/* ── Construtores de campos ───────────────────── */
const v = p => getPath(state.profile, p);
function inp(path, label, o = {}) {
  return `<label class="fld ${o.cls || ''}"><span>${label}</span><input ${o.type ? `type="${o.type}"` : ''} data-bind="${path}" ${o.dtype ? `data-type="${o.dtype}"` : ''} value="${esc(v(path))}" ${o.ph ? `placeholder="${esc(o.ph)}"` : ''}>${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
function area(path, label, rows = 3, o = {}) {
  const val = o.lines ? (v(path) || []).join('\n') : (v(path) ?? '');
  return `<label class="fld ${o.cls || ''}"><span>${label}</span><textarea rows="${rows}" data-bind="${path}" ${o.lines ? 'data-type="lines"' : ''}>${esc(val)}</textarea>${o.hint ? `<small>${o.hint}</small>` : ''}</label>`;
}
function chk(path, label, cls = '') { return `<label class="chk ${cls}"><input type="checkbox" data-bind="${path}" ${v(path) ? 'checked' : ''}>${label}</label>`; }
function color(path, label) {
  let c = String(v(path) || ''); if (!/^#[0-9a-f]{6}$/i.test(c)) c = '#2563EB';
  return `<label class="fld"><span>${label}</span><input type="color" data-bind="${path}" value="${c}"></label>`;
}
function selectF(path, label, opts, o = {}) {
  return `<label class="fld ${o.cls || ''}"><span>${label}</span><select data-bind="${path}" ${o.rerender ? 'data-rerender="1"' : ''}>${opts.map(([val, t]) => `<option value="${val}" ${v(path) === val ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
}
function pageHead(t, d) { return `<div class="page-h"><h1>${t}</h1><p>${d}</p></div>`; }
function secHead(base, o = {}) {
  return `<div class="card"><h3>Cabeçalho da seção <small>título que aparece no site</small></h3><div class="grid c2">${inp(base + '.title', 'Título da seção')}${inp(base + '.subtitle', 'Subtítulo')}${o.desc ? area(base + '.desc', 'Texto de apoio', 2, {cls: 'full'}) : ''}</div></div>`;
}
const ALIGN = {
  justifyLeft: [14, 10, 14, 6], justifyCenter: [14, 8, 11, 6], justifyRight: [14, 6, 14, 10], justifyFull: [14, 14, 14, 14]
};
function alignIcon(cmd) {
  const w = ALIGN[cmd];
  const x = (len, i) => cmd === 'justifyCenter' ? (14 - len) / 2 : cmd === 'justifyRight' ? 14 - len : 0;
  return `<svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor">${w.map((l, i) => `<rect x="${x(l, i)}" y="${i * 3.3}" width="${l}" height="1.6" rx=".8"/>`).join('')}</svg>`;
}
/* Editor de texto rico. mode: 'html' (bloco) | 'items' (lista -> cada <li> vira um item). hl: 'about'|'hero'|'plain' */
function rte(path, label, o = {}) {
  const mode = o.mode || 'html', val = v(path);
  const html = mode === 'items' ? `<ul>${(val && val.length ? val : ['']).map(i => `<li>${i || '<br>'}</li>`).join('')}</ul>` : (val || '');
  const B = (cmd, t, title, cls = '') => `<button type="button" class="${cls}" data-cmd="${cmd}" title="${title}">${t}</button>`;
  const full = mode === 'html';
  return `<div class="fld rte ${mode}" data-mode="${mode}" data-hl="${o.hl || ''}"><span>${label}</span>
    <div class="rte-bar">
      ${B('bold', '<b>B</b>', 'Negrito (Ctrl+B)')}${B('italic', '<i>I</i>', 'Itálico (Ctrl+I)')}${B('underline', '<u>U</u>', 'Sublinhado (Ctrl+U)')}
      ${full ? `<i class="sep"></i>${B('h2', 'H2', 'Título')}${B('h3', 'H3', 'Subtítulo')}${B('p', '¶', 'Parágrafo normal')}` : ''}
      <i class="sep"></i>${B('insertUnorderedList', '• Lista', 'Lista com marcadores')}${B('insertOrderedList', '1. Lista', 'Lista numerada')}
      <i class="sep"></i>${B('link', '🔗', 'Inserir/editar link')}${B('unlink', '⛓✕', 'Remover link')}
      ${full ? `<i class="sep"></i>${['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'].map(c => B(c, alignIcon(c), {justifyLeft: 'Alinhar à esquerda', justifyCenter: 'Centralizar', justifyRight: 'Alinhar à direita', justifyFull: 'Justificar'}[c])).join('')}` : ''}
      ${o.hl ? `<i class="sep"></i>${B('highlight', '✨ Destaque', 'Aplica/remove o destaque visual do site na seleção', 'hl')}` : ''}
      <i class="sep"></i>${B('removeFormat', '⌫ Limpar', 'Remove a formatação da seleção')}
    </div>
    <div class="rte-area" contenteditable="true" spellcheck="true" data-path="${path}">${html}</div>
    ${o.hint ? `<small>${o.hint}</small>` : ''}</div>`;
}
/* Lista simples em linhas: cols = [{k,label,flex,type,ph}] */
function listRows(path, cols, tpl, addLabel, o = {}) {
  const arr = v(path) || [];
  const head = `<div class="row-h"><span style="width:22px"></span>${cols.map(c => `<span style="flex:${c.flex || 1}">${c.label}</span>`).join('')}<span style="width:${o.btnW || 100}px"></span></div>`;
  const rows = arr.map((it, i) => `<div class="row" data-item data-i="${i}"><span class="handle" title="Arraste para reordenar">⠿</span>${cols.map(c => {
    const p = `${path}.${i}.${c.k}`;

    if (c.type === 'number') return `<input style="flex:${c.flex || 1}" type="number" min="0" max="100" data-type="number" data-bind="${p}" value="${esc(it[c.k])}" placeholder="${esc(c.label)}">`;
    return `<input style="flex:${c.flex || 1}" data-bind="${p}" ${c.dtype ? `data-type="${c.dtype}"` : ''} value="${esc(it[c.k])}" placeholder="${esc(c.ph || c.label)}">`;
  }).join('')}<span class="btns">${btns(path, i, arr.length)}</span></div>`).join('');
  return `<div class="rows" data-list="${path}">${arr.length ? head + rows : '<div class="empty">Nenhum item ainda.</div>'}</div>
    <div style="margin-top:12px"><button class="btn sm" data-action="add" data-path="${path}" data-tpl="${tpl}" data-pos="${o.pos || 'end'}">＋ ${addLabel}</button></div>`;

}

/* ── Eventos do painel ────────────────────────── */
panel.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.bind) {
    let val;
    if (t.type === 'checkbox') val = t.checked;
    else if (t.dataset.type === 'number') val = Math.max(0, Math.min(100, Number(t.value) || 0));
    else if (t.dataset.type === 'lines') val = t.value.split('\n').map(s => s.trim()).filter(Boolean);
    else if (t.dataset.type === 'digits') val = t.value.replace(/\D/g, '');
    else val = t.value;
    if (t.dataset.rerender) pushUndo();
    setPath(state.profile, t.dataset.bind, val);
    changed();
    $$('[data-live]').forEach(n => { n.textContent = getPath(state.profile, n.dataset.live) ?? ''; });
    if (t.type === 'checkbox' && /\.current$/.test(t.dataset.bind)) renderPanel();
    if (t.dataset.rerender) renderPanel();
  } else if (t.classList && t.classList.contains('rte-area')) onRte(t);
});
panel.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.type === 'digits') t.value = getPath(state.profile, t.dataset.bind);
  if (t.dataset && t.dataset.type === 'url') { const u = normUrl(t.value); t.value = u; setPath(state.profile, t.dataset.bind, u); changed(); }
  if (t.id === 'photoInput' && t.files[0]) handlePhoto(t.files[0]);
});
panel.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (b) return action(b);
  const c = e.target.closest('[data-cmd]'); if (c) rteCommand(c);
});
panel.addEventListener('mousedown', e => { if (e.target.closest('.rte-bar')) e.preventDefault(); });
panel.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newSkill') { e.preventDefault(); addSkill(); }
});

function action(b) {
  const a = b.dataset.action, path = b.dataset.path, i = Number(b.dataset.i);
  if (a === 'toggle') { const id = b.dataset.id; state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id); renderPanel(); return; }
  if (a === 'discard-draft') return discardChanges();
  if (a === 'skill-add') return addSkill();
  const arr = path ? v(path) : null;
  if (a === 'add') {
    pushUndo(); const item = TPL[b.dataset.tpl]();
    b.dataset.pos === 'start' ? arr.unshift(item) : arr.push(item);
    if (item.id) state.expanded.add(item.id);
  } else if (a === 'remove') {
    pushUndo(); arr.splice(i, 1);
    toast('Item removido.', false, {label: 'Desfazer', fn: undo});
  } else if (a === 'up' || a === 'down') {
    const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= arr.length) return;
    pushUndo(); [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  changed(); renderPanel();
}
function addSkill() {
  const name = $('#newSkill').value.trim(); if (!name) { $('#newSkill').focus(); return; }
  pushUndo(); v('skills.items').push({name, category: $('#newSkillCat').value});
  changed(); renderPanel(); $('#newSkill').focus();
}

/* Arrastar e soltar (reordenar) */
let drag = null;
panel.addEventListener('mousedown', e => { const h = e.target.closest('.handle'); if (h) h.closest('[data-item]').draggable = true; });
document.addEventListener('mouseup', () => $$('[data-item][draggable=true]').forEach(x => x.draggable = false));
panel.addEventListener('dragstart', e => {
  const it = e.target.closest && e.target.closest('[data-item]'); if (!it || !it.draggable) return;
  drag = {path: it.closest('[data-list]').dataset.list, i: Number(it.dataset.i)};
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'cv'); it.classList.add('dragging');
});
panel.addEventListener('dragend', () => { drag = null; $$('[data-item]').forEach(x => { x.draggable = false; x.classList.remove('dragging', 'over'); }); });
panel.addEventListener('dragover', e => {
  if (!drag) return; const it = e.target.closest('[data-item]');
  if (it && it.closest('[data-list]').dataset.list === drag.path) { e.preventDefault(); $$('.over').forEach(x => x.classList.remove('over')); it.classList.add('over'); }
});
panel.addEventListener('drop', e => {
  if (!drag) return; const it = e.target.closest('[data-item]');
  if (!it || it.closest('[data-list]').dataset.list !== drag.path) return;
  e.preventDefault(); const to = Number(it.dataset.i), arr = v(drag.path);
  if (to !== drag.i) { pushUndo(); arr.splice(to, 0, arr.splice(drag.i, 1)[0]); changed(); }
  drag = null; renderPanel();
});

/* ── Editor de texto rico ─────────────────────── */
try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
function htmlToItems(areaEl) {
  const items = [];
  const add = h => { const s = sanitize(h, true); if (s) items.push(s); };
  Array.from(areaEl.childNodes).forEach(n => {
    if (n.nodeType === 1 && /^(UL|OL)$/.test(n.tagName)) Array.from(n.children).forEach(li => add(li.innerHTML));
    else if (n.nodeType === 1) add(n.innerHTML); else add(esc(n.nodeValue));
  });
  return items;
}
function onRte(areaEl) {
  const wrap = areaEl.closest('.rte'), path = areaEl.dataset.path;
  setPath(state.profile, path, wrap.dataset.mode === 'items' ? htmlToItems(areaEl) : sanitize(areaEl.innerHTML));
  changed();
}
function inArea(areaEl) { const s = getSelection(); return s.rangeCount && areaEl.contains(s.anchorNode); }
function unwrap(el) { const p = el.parentNode; while (el.firstChild) p.insertBefore(el.firstChild, el); p.removeChild(el); }
function rteCommand(btn) {
  const wrap = btn.closest('.rte'), areaEl = $('.rte-area', wrap), cmd = btn.dataset.cmd;
  if (!inArea(areaEl)) {
    areaEl.focus(); const r = document.createRange(); r.selectNodeContents(areaEl); r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  if (cmd === 'link') return openLink(areaEl);
  if (cmd === 'highlight') applyHighlight(areaEl, wrap.dataset.hl);
  else if (/^h[23]$|^p$/.test(cmd)) document.execCommand('formatBlock', false, '<' + cmd + '>');
  else document.execCommand(cmd, false, null);
  areaEl.focus(); onRte(areaEl);
}
function applyHighlight(areaEl, kind) {
  const sel = getSelection(); if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0), root = r.commonAncestorContainer.nodeType === 1 ? r.commonAncestorContainer : r.commonAncestorContainer.parentElement;
  const q = {about: 'span.about-highlight', hero: 'strong[style]', plain: 'span'}[kind];
  const anc = root.closest(q);
  if (anc && areaEl.contains(anc)) { unwrap(anc); return; }
  if (r.collapsed) { toast('Selecione o texto que será destacado.'); return; }
  const tmp = document.createElement('div'); tmp.appendChild(r.cloneContents());
  const open = {about: '<span class="about-highlight">', hero: '<strong style="color:#93C5FD">', plain: '<span>'}[kind];
  document.execCommand('insertHTML', false, open + tmp.innerHTML + (kind === 'hero' ? '</strong>' : '</span>'));
}
panel.addEventListener('paste', e => {
  const areaEl = e.target.closest && e.target.closest('.rte-area'); if (!areaEl) return;
  e.preventDefault();
  const inline = areaEl.closest('.rte').dataset.mode === 'items';
  const h = e.clipboardData.getData('text/html'), t = e.clipboardData.getData('text/plain');
  document.execCommand('insertHTML', false, h ? sanitize(h, inline) : esc(t).replace(/\n/g, inline ? ' ' : '<br>'));
});
let linkCtx = null;
function openLink(areaEl) {
  const s = getSelection(); if (!s.rangeCount) return;
  const range = s.getRangeAt(0).cloneRange();
  const root = range.commonAncestorContainer.nodeType === 1 ? range.commonAncestorContainer : range.commonAncestorContainer.parentElement;
  const a = root.closest('a');
  linkCtx = {areaEl, range}; $('#linkUrl').value = a ? a.getAttribute('href') : 'https://';
  $('#linkDlg').showModal(); $('#linkUrl').select();
}
function finishLink(rv) {
  const dlg = $('#linkDlg'); if (dlg.open) dlg.close(rv);
  if (!linkCtx || rv === 'cancel') { linkCtx = null; return; }
  const {areaEl, range} = linkCtx; linkCtx = null;
  areaEl.focus(); const s = getSelection(); s.removeAllRanges(); s.addRange(range);
  const url = normUrl($('#linkUrl').value);
  if (rv === 'remove') document.execCommand('unlink');
  else if (url && range.collapsed) document.execCommand('insertHTML', false, `<a href="${esc(url)}">${esc(url)}</a>`);
  else if (url) document.execCommand('createLink', false, url);
  onRte(areaEl);
}
$('#linkForm').addEventListener('submit', e => { e.preventDefault(); finishLink('ok'); });
$('#linkDlg').addEventListener('click', e => { if (e.target === $('#linkDlg')) finishLink('cancel'); });

/* ── Foto ──────────────────────────────────────── */
async function handlePhoto(file) {
  if (!/^image\//.test(file.type)) return toast('Escolha um arquivo de imagem.', true);
  if (file.size > 25 * 1024 * 1024) return toast('Imagem muito grande (máx. 25 MB).', true);
  try {
    const bmp = await createImageBitmap(file, {imageOrientation: 'from-image'});
    const k = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    const dataUrl = await new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
    state.photo = {blob, dataUrl};
    state.profile.hero.photo = PHOTO_PATH;
    state.profile.meta.updatedAt = new Date().toISOString();
    $('#photoPrev').src = dataUrl;
    $('#photoInfo').textContent = `Nova foto pronta (${c.width}×${c.height}, ${Math.round(blob.size / 1024)} KB) — clique em “Salvar no projeto”.`;
    changed();
  } catch (err) { toast('Não foi possível ler a imagem: ' + err.message, true); }
}
const dataUrlToBlob = u => { const [h, d] = u.split(','), bin = atob(d), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type: h.match(/:(.*?);/)[1]}); };

/* ── Salvar ───────────────────────────────────── */
const download = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };
const profileJson = () => JSON.stringify(state.profile, null, 2) + '\n';
async function writeFile(dir, path, data) {
  const parts = path.split('/'), name = parts.pop();
  for (const p of parts) dir = await dir.getDirectoryHandle(p, {create: true});
  const w = await (await dir.getFileHandle(name, {create: true})).createWritable();
  await w.write(data); await w.close();
}
async function saveProject() {
  state.profile.meta.updatedAt = new Date().toISOString();
  if (!window.showDirectoryPicker) {
    download(new Blob([profileJson()], {type: 'application/json'}), 'profile.json');
    if (state.photo) download(state.photo.blob, 'profile.jpg');
    toast('Este navegador não grava em pastas: arquivos baixados. Copie profile.json para a raiz e profile.jpg para uploads/.');
    return markSaved(false);
  }
  try {
    if (!state.dir) {
      state.dir = await showDirectoryPicker({mode: 'readwrite', id: 'cv-digital'});
      let ok = true; try { await state.dir.getFileHandle('index.html'); } catch (e) { ok = false; }
      if (!ok && !confirm('A pasta escolhida não tem index.html. Salvar mesmo assim?')) { state.dir = null; return; }
    }
    await writeFile(state.dir, 'profile.json', profileJson());
    if (state.photo) await writeFile(state.dir, PHOTO_PATH, state.photo.blob);
    markSaved(true);
    toast('Salvo em profile.json' + (state.photo ? ' e uploads/profile.jpg' : '') + '. Para publicar: faça commit e push.');
  } catch (err) {
    if (err.name === 'AbortError') return;
    state.dir = null; toast('Falha ao salvar: ' + err.message, true);
  }
}
function markSaved() { state.dirty = false; localStorage.removeItem(DRAFT_KEY); state.draftBanner = false; updateStatus(); pushPreview(); if (state.section === 'hero') $('#photoInfo') && ($('#photoInfo').textContent = ''); }
$('#btnSave').onclick = saveProject;
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveProject(); } });

/* ── Exportar HTML (pacote pronto para deploy) ── */
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
const crc32 = u8 => { let c = ~0; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (~c) >>> 0; };
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], now = new Date();
  const dt = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  const tm = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(10, tm, true); lh.setUint16(12, dt, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(12, tm, true); ch.setUint16(14, dt, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type: 'application/zip'});
}
async function exportHtml() {
  const btn = $('#btnExport'); btn.disabled = true;
  try {
    const prof = clone(state.profile); prof.meta.updatedAt = new Date().toISOString();
    const tpl = await (await fetch('index.html', {cache: 'no-store'})).text();
    if (!tpl.includes('<div id="app"></div>') || !tpl.includes('<!-- profile-data -->')) throw new Error('index.html não tem os marcadores esperados (#app e profile-data).');
    const inner = await snapshotHtml(prof); pushPreview();
    const json = JSON.stringify(prof).replace(/</g, '\\u003c');
    let out = tpl
      .replace('<div id="app"></div>', () => `<div id="app" data-prerendered="1">${inner}</div>`)
      .replace('<!-- profile-data -->', () => `<script id="profile-data" type="application/json">${json}<\/script>`)
      .replace(/<title>[\s\S]*?<\/title>/, () => `<title>${esc(prof.meta.title || '')}</title>`)
      .replace(/<html lang="[^"]*"/, () => `<html lang="${esc(prof.meta.lang || 'pt-BR')}"`);
    if (prof.meta.description) out = out.replace('<meta name="viewport"', m => `<meta name="description" content="${esc(prof.meta.description)}">\n${m}`);
    const photo = state.photo ? state.photo.blob : await (await fetch(PHOTO_PATH, {cache: 'no-store'})).blob();
    const buf = async b => new Uint8Array(await b.arrayBuffer()), enc = new TextEncoder();
    const zip = makeZip([
      {name: 'index.html', data: enc.encode(out)},
      {name: 'profile.json', data: enc.encode(JSON.stringify(prof, null, 2) + '\n')},
      {name: PHOTO_PATH, data: await buf(photo)}
    ]);
    download(zip, 'cv-digital-deploy.zip');
    toast('Pacote gerado: index.html + profile.json + uploads/profile.jpg (sem admin.html).');
  } catch (err) { toast('Falha ao exportar: ' + err.message, true); }
  btn.disabled = false;
}
$('#btnExport').onclick = exportHtml;

/* ── Menu lateral: baixar / importar / descartar ── */
$('#btnDownload').onclick = () => { download(new Blob([profileJson()], {type: 'application/json'}), 'profile.json'); };
$('#btnImport').onclick = () => $('#fileImport').click();
$('#fileImport').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const p = JSON.parse(await f.text()); if (!p || typeof p !== 'object' || !p.hero) throw new Error('arquivo não parece um profile.json');
    pushUndo(); state.profile = normalize(p); changed(); renderPanel(); toast('profile.json importado.');
  } catch (err) { toast('Importação falhou: ' + err.message, true); }
};
function discardChanges() {
  if (state.dirty && !confirm('Descartar todas as alterações não salvas e voltar ao profile.json do projeto?')) return;
  localStorage.removeItem(DRAFT_KEY); state.profile = normalize(clone(state.server)); state.photo = null; state.undo = [];
  state.dirty = false; state.draftBanner = false; updateStatus(); renderPanel(); pushPreview();
}
$('#btnDiscard').onclick = discardChanges;

/* ── Inicialização ────────────────────────────── */
async function init() {
  try {
    const r = await fetch('profile.json', {cache: 'no-store'}); if (!r.ok) throw new Error('HTTP ' + r.status);
    state.server = await r.json();
  } catch (err) {
    document.body.style.display = 'block'; document.body.style.overflow = 'auto';
    document.body.innerHTML = `<div class="fatal"><h2>Não foi possível carregar o profile.json</h2><p>${esc(err.message)}</p>
      <p>O painel precisa ser aberto por um servidor local (abrir o arquivo direto do disco não funciona). Na pasta do projeto, rode:</p>
      <pre>python3 -m http.server 8000</pre><p>e acesse <code>http://localhost:8000/admin.html</code>.</p></div>`;
    return;
  }
  let draft = null; try { draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
  if (draft && draft.profile && draft.profile.hero) {
    state.profile = normalize(draft.profile); state.dirty = true; state.draftBanner = true;
    if (draft.photoDataUrl) state.photo = {dataUrl: draft.photoDataUrl, blob: dataUrlToBlob(draft.photoDataUrl)};
  } else state.profile = normalize(clone(state.server));
  renderNav(); renderPanel(); updateStatus(); fitPreview(); hello(); pushPreview();
}
init();
</script>
